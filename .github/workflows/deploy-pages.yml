name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  verify-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kiểm tra luồng Pages trước khi xuất bản
        run: |
          node tests/frontend.test.cjs
          node tests/matrices_frontend.test.cjs
          node --test tests/table_file_helper.test.cjs
          node --test tests/static_*.test.cjs

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Chuẩn bị tệp tĩnh (Frontend)
        run: |
          # Đảm bảo đường dẫn tệp tĩnh là tương đối để chạy chuẩn trên GitHub Pages
          sed -i.bak 's|href="/|href="./|g; s|src="/|src="./|g' public/index.html
          rm -f public/index.html.bak

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Tải lên artifact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: [verify-static, build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Xuất bản lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
