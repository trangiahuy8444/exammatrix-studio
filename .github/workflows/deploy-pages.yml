name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Chuẩn bị tệp tĩnh (Frontend)
        run: |
          # Đảm bảo đường dẫn tệp tĩnh là tương đối để chạy chuẩn trên GitHub Pages
          sed -i.bak 's|href="/|href="./|g; s|src="/|src="./|g' public/index.html
          rm -f public/index.html.bak

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Tải lên artifact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Xuất bản lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
